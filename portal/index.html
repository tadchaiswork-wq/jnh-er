<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JNH ER</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JNH ER">
<meta name="theme-color" content="#0e7490" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
    --brand:#0e7490;--brand-d:#155e75;--shadow:0 1px 3px rgba(15,23,42,.08),0 10px 30px rgba(15,23,42,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:radial-gradient(1100px 460px at 50% -8%,#cffafe,transparent),var(--bg);color:var(--ink);
    min-height:100vh;line-height:1.5}
  .wrap{max-width:1040px;margin:0 auto;padding:34px 18px 60px}
  .head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:26px}
  .mark{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,#0e7490,#155e75);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;box-shadow:0 10px 24px rgba(14,116,144,.35)}
  .head h1{font-size:27px;font-weight:800;letter-spacing:.5px;color:var(--brand-d)}
  .head p{color:var(--muted);font-size:14px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
  .tile{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);
    text-decoration:none;color:inherit;transition:.15s}
  .tile:hover{transform:translateY(-2px);border-color:var(--brand)}
  .tile .ic{width:56px;height:56px;border-radius:14px;object-fit:cover;display:block;box-shadow:0 2px 8px rgba(15,23,42,.12)}
  .tile .nm{font-weight:700;font-size:16px}
  .tile .ds{font-size:13px;color:var(--muted)}
  .tile .go{margin-top:auto;font-size:13px;font-weight:700;color:var(--brand-d)}
  .lock{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;color:var(--brand-d);
    background:#e0f2fe;border:1px solid #bae6fd;border-radius:999px;padding:2px 9px}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="mark">✚</div>
    <h1>JNH ER</h1>
    <p>ศูนย์รวมระบบงานห้องฉุกเฉิน — เลือกระบบที่ต้องการใช้งาน</p>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="foot">เลือกระบบที่ต้องการใช้งานได้เลย</div>
</div>
<script>
const APPS=[
  {name:"ER Fast Track", ds:"หน้าจอเคสเร่งด่วน / Monitor", img:"../fasttrack/icon-192.png", url:"../fasttrack/"},
  {name:"EMS Record", ds:"บันทึก & สั่งการ EMS", img:"../ems/icon-192.png", url:"../ems/"},
  {name:"Monitor รวม", ds:"จอแสดงผลรวมใน ER", img:"../monitor/icon-192.png", url:"../monitor/"},
  {name:"CPR Timeline", ds:"ไทม์ไลน์ช่วยฟื้นคืนชีพ", img:"../cpr/icon-192.png", url:"../cpr/"},
  {name:"Checklist ของ", ds:"เช็คของ ER & EMS รายเวร", img:"../checklist/icon-192.png", url:"../checklist/"},
  {name:"Triage", ds:"คัดแยกผู้ป่วย ESI/MOPH", img:"../triage/icon-192.png", url:"../triage/"},
  {name:"รักและใส่ใจ ER", ds:"ลงเวร · รายงาน · ชื่นชม", img:"../rak/icons/icon-192.png", url:"../rak/"},
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("tiles").innerHTML=APPS.map(a=>`
  <a class="tile" href="${a.url}">
    ${a.lock?'<span class="lock">🔒 รหัส</span>':''}
    <img class="ic" src="${a.img}" alt="">
    <div class="nm">${esc(a.name)}</div><div class="ds">${esc(a.ds)}</div>
    <div class="go">เปิด →</div>
  </a>`).join("");
</script>
</body>
</html>
