<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ใบนำส่งผู้ป่วยระหว่างหน่วยงาน — JNH ER</title>
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<script src="../time-sync.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--navy:#0e2a47;--navy2:#1a3a5c;--accent:#2563eb;--ok:#15803d;--warn:#d97706;--red:#dc2626;--line:#e2e8f0;--muted:#64748b;--bg:#f1f5f9;--panel:#fff;--text:#0f172a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:'Sarabun','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.screen{display:none;min-height:100dvh}
.screen.active{display:block}
.wrap{max-width:860px;margin:0 auto;padding:16px}

/* Header */
.app-hdr{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30}
.app-hdr .ttl{font-size:17px;font-weight:800;flex:1;line-height:1.2}
.app-hdr .sub{font-size:12px;color:#bcd;font-weight:400}
.hdr-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:9px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer}
.fb-dot{font-size:11px;padding:2px 8px;border-radius:20px}
.fb-ok{background:#15803d}.fb-off{background:#64748b}.fb-err{background:#b91c1c}

/* Home */
.home-wrap{max-width:560px;margin:0 auto;padding:30px 18px;display:flex;flex-direction:column;gap:16px;min-height:calc(100dvh - 0px);justify-content:center}
.home-logo{text-align:center;margin-bottom:6px}
.home-logo .h1{font-size:24px;font-weight:800;color:var(--navy)}
.home-logo .h2{font-size:14px;color:var(--muted)}
.big-btn{border:none;border-radius:18px;padding:22px;font-size:20px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;align-items:center;gap:14px;justify-content:center}
.big-btn.new{background:linear-gradient(145deg,#2563eb,#1d4ed8)}
.big-btn.list{background:linear-gradient(145deg,#0e7490,#155e75)}
.big-btn.dash{background:linear-gradient(145deg,#15803d,#166534)}
.big-btn:active{filter:brightness(.93)}

/* Wizard */
.wiz-steps{display:flex;gap:4px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:20;overflow-x:auto}
.wiz-step{flex:1;min-width:58px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px 4px;border-radius:8px;white-space:nowrap}
.wiz-step.on{background:var(--accent);color:#fff}
.wiz-step.done{color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h3{margin:0 0 12px;font-size:16px;color:var(--navy);border-bottom:2px solid var(--line);padding-bottom:7px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:5px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .fld{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:560px){.grid4{grid-template-columns:repeat(2,1fr)}.grid5{grid-template-columns:repeat(3,1fr)}}

/* toggles */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:9px 6px;font-size:14px;font-weight:700;color:#475569;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg button.on.ok{background:var(--ok);border-color:var(--ok)}
.seg button.on.no{background:var(--red);border-color:var(--red)}
.seg button.on.warn{background:var(--warn);border-color:var(--warn)}
.chk{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;user-select:none}
.chk.on{background:#dbeafe;border-color:var(--accent);color:#1d4ed8}
.chk .bx{width:18px;height:18px;border:2px solid #94a3b8;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
.chk.on .bx{background:var(--accent);border-color:var(--accent);color:#fff}
.sublabel{font-size:12px;color:var(--muted);margin:4px 0}

/* obs table */
.obs-tbl{width:100%;border-collapse:collapse;font-size:13px}
.obs-tbl th{background:var(--navy2);color:#fff;font-size:11px;padding:6px 3px;font-weight:700}
.obs-tbl td{border:1px solid var(--line);padding:2px}
.obs-tbl input{width:100%;border:none;padding:6px 4px;text-align:center;font-size:13px;background:transparent}
.obs-tbl input:focus{outline:1.5px solid var(--accent);border-radius:4px}
.obs-tbl .col-note input{text-align:left}
.obs-del{background:#fff;border:1px solid #fca5a5;color:var(--red);border-radius:6px;padding:4px 7px;font-weight:800;cursor:pointer}
.obs-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.alert-bar{display:flex;align-items:center;gap:10px;background:#fffbeb;border:1.5px solid #fcd34d;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:700;color:#92400e;font-size:14px;flex-wrap:wrap}

/* signature */
.sig-wrap{border:1.5px dashed #94a3b8;border-radius:10px;background:#fff;position:relative}
.sig-wrap canvas{width:100%;height:150px;display:block;touch-action:none;border-radius:10px}
.sig-clear{position:absolute;top:6px;right:6px;background:#f1f5f9;border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}

/* nav */
.wiz-nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;z-index:20}
.nav-btn{flex:1;border:none;border-radius:11px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
.nav-prev{background:#e2e8f0;color:#334155}
.nav-next{background:var(--accent);color:#fff}
.nav-save{background:var(--ok);color:#fff}

/* list / dashboard */
.rec-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rec-card .nm{font-weight:800;font-size:16px}
.rec-card .mt{font-size:12.5px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;margin-right:4px}
.b-bad{background:#fee2e2;color:#b91c1c}.b-worse{background:#fef3c7;color:#92400e}.b-cmt{background:#e0e7ff;color:#3730a3}
.mini-btn{border:none;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:800;cursor:pointer;color:#fff;background:var(--accent)}
.mini-btn.gray{background:#64748b}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.stat .v{font-size:34px;font-weight:800;color:var(--navy)}
.stat .l{font-size:13px;color:var(--muted);margin-top:3px}
.stat.bad .v{color:var(--red)}.stat.worse .v{color:var(--warn)}.stat.cmt .v{color:#4338ca}
.month-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.ov.hide{display:none}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%}
.modal h3{margin:0 0 10px;color:var(--navy)}
.m-btns{display:flex;gap:10px;margin-top:16px}
.m-btns button{flex:1;border:none;border-radius:11px;padding:13px;font-weight:800;cursor:pointer}
.m-cancel{background:#e2e8f0;color:#334155}.m-ok{background:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:200;opacity:0;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* A4 print form */
#a4-form{display:none;position:absolute;left:-9999px;top:0;width:794px;background:#fff;color:#000;padding:26px 30px;font-size:12px;line-height:1.45}
#a4-form.showprint{display:block;position:static;left:0;margin:0 auto}
.a4-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.a4-head .ht{font-size:15px;font-weight:800;text-align:center;flex:1}
.a4-head .hs{font-size:12px;font-weight:600;text-align:center}
.a4-sticker{border:1px solid #000;border-radius:6px;padding:5px 8px;font-size:10px;width:210px}
.a4-line{margin:3px 0}
.a4-sec{font-weight:800;margin:8px 0 3px;font-size:12.5px}
.a4-chk{display:inline-block;margin-right:14px}
.a4-box{display:inline-block;width:12px;height:12px;border:1.3px solid #000;text-align:center;line-height:11px;font-weight:900;margin-right:3px;vertical-align:-1px}
table.a4-tbl{width:100%;border-collapse:collapse;font-size:10px;margin-top:3px}
table.a4-tbl th,table.a4-tbl td{border:1px solid #000;padding:2px 3px;text-align:center}
.a4-foot{font-size:9px;margin-top:8px;color:#333}
.u{border-bottom:1px dotted #000;padding:0 4px}
.sig-img{max-height:46px}

@media print{
  body{background:#fff}
  .screen,.app-hdr,.wiz-steps,.wiz-nav,.toast{display:none!important}
  #a4-form{display:block!important;position:static;left:0;width:100%;padding:0}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>

<!-- ========== HOME ========== -->
<div id="s-home" class="screen active">
  <div class="home-wrap">
    <div class="home-logo">
      <div class="h1">🚑 ใบนำส่งผู้ป่วยระหว่างหน่วยงาน</div>
      <div class="h2">โรงพยาบาลชัยนาทนเรนทร · หน่วยงานอุบัติเหตุฉุกเฉิน · <span id="home-fb"></span></div>
    </div>
    <button class="big-btn new" onclick="startNew()">➕ สร้างใบนำส่งใหม่</button>
    <button class="big-btn dash" onclick="askAdmin('dashboard')">📊 Dashboard รายเดือน</button>
    <button class="big-btn list" onclick="askAdmin('list')">🗂 รายการเคส / Review (admin)</button>
    <div style="text-align:center"><button class="hdr-btn" style="background:#e2e8f0;color:#334155" onclick="askAdmin('setpass')">🔒 เปลี่ยนรหัส admin</button></div>
  </div>
</div>

<!-- ========== WIZARD ========== -->
<div id="s-wiz" class="screen">
  <div class="app-hdr">
    <button class="hdr-btn" onclick="confirmExitWiz()">← หน้าแรก</button>
    <div class="ttl">ใบนำส่งผู้ป่วย <span class="sub" id="wiz-pt"></span></div>
    <span class="fb-dot fb-off" id="wiz-fb">●</span>
  </div>
  <div class="wiz-steps" id="wiz-steps"></div>
  <div class="wrap" id="wiz-body"></div>
  <div class="wiz-nav">
    <button class="nav-btn nav-prev" id="btn-prev" onclick="wizPrev()">← ย้อน</button>
    <button class="nav-btn nav-next" id="btn-next" onclick="wizNext()">ถัดไป →</button>
  </div>
</div>

<!-- ========== DASHBOARD ========== -->
<div id="s-dash" class="screen">
  <div class="app-hdr"><button class="hdr-btn" onclick="go('home')">← หน้าแรก</button><div class="ttl">📊 Dashboard รายเดือน</div></div>
  <div class="wrap">
    <div class="month-row">
      <label style="font-weight:700">เดือน:</label>
      <input type="month" class="inp" id="dash-month" style="max-width:200px" onchange="renderDash()">
      <button class="mini-btn gray" onclick="reviewPDF()">📄 Review PDF เคสที่ต้องทบทวน</button>
    </div>
    <div class="stat-grid" id="dash-stats"></div>
    <div id="dash-list"></div>
  </div>
</div>

<!-- ========== LIST ========== -->
<div id="s-list" class="screen">
  <div class="app-hdr"><button class="hdr-btn" onclick="go('home')">← หน้าแรก</button><div class="ttl">🗂 รายการเคสนำส่ง</div></div>
  <div class="wrap">
    <div class="month-row">
      <input type="month" class="inp" id="list-month" style="max-width:200px" onchange="renderList()">
      <input type="text" class="inp" id="list-search" placeholder="ค้นหา HN / ชื่อ..." oninput="renderList()" style="flex:1;min-width:140px">
    </div>
    <div id="list-body"></div>
  </div>
</div>

<!-- A4 print container -->
<div id="a4-form"></div>

<!-- admin modal -->
<div class="ov hide" id="admin-modal">
  <div class="modal">
    <h3 id="admin-title">🔒 ใส่รหัส Admin</h3>
    <input type="password" class="inp" id="admin-inp" inputmode="numeric" placeholder="รหัส Admin" onkeydown="if(event.key==='Enter')adminOk()">
    <div id="admin-extra"></div>
    <div class="m-btns"><button class="m-cancel" onclick="hideEl('admin-modal')">ยกเลิก</button><button class="m-ok" onclick="adminOk()">ตกลง</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================ CONFIG */
const FB = window.FIREBASE_CONFIG || null;
const DRIVE_URL = (window.LINKS_DRIVE_URL||'').trim();
const PATH = 'transfer';
let fbApp=null, fbDB=null, fbRef=null, fbOK=false;
let CASES = {};          // id -> record
let SETTINGS = { adminPass:'1234' };
let adminOK=false, adminAction=null;
let R=null, page=1, PAGES=5;
let alertTimer=null, audioCtx=null;
let sigPads={};          // name -> {canvas,ctx,drawn}
const $ = id=>document.getElementById(id);

/* ============================================================ FIREBASE */
function initFB(){
  if(!FB || typeof firebase==='undefined'){ setFB('off'); return; }
  try{
    fbApp = firebase.apps.length ? firebase.app() : firebase.initializeApp(FB);
    fbDB  = firebase.database(fbApp);
    fbRef = fbDB.ref(PATH);
    fbRef.child('cases').on('value', s=>{ CASES = s.val()||{}; setFB('ok'); liveRefresh(); },
      ()=>setFB('err'));
    fbRef.child('settings').on('value', s=>{ const v=s.val(); if(v) SETTINGS=Object.assign({adminPass:'1234'},v); });
    fbDB.ref('.info/connected').on('value', s=>setFB(s.val()?'ok':'off'));
  }catch(e){ console.warn('FB',e); setFB('err'); }
}
function setFB(st){
  const t = st==='ok'?'● ออนไลน์':st==='err'?'● ต่อไม่ได้':'● ออฟไลน์';
  const c = 'fb-dot '+(st==='ok'?'fb-ok':st==='err'?'fb-err':'fb-off');
  ['wiz-fb'].forEach(id=>{const e=$(id);if(e){e.className=c;e.textContent='●';}});
  const h=$('home-fb'); if(h) h.textContent=t;
  fbOK = st==='ok';
}
function liveRefresh(){
  if($('s-dash').classList.contains('active')) renderDash();
  if($('s-list').classList.contains('active')) renderList();
}

/* ============================================================ NAV */
function go(scr){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $('s-'+scr).classList.add('active'); window.scrollTo(0,0); }

function toast(msg,ms){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'), ms||2600); }
function hideEl(id){ $(id).classList.add('hide'); }

/* ============================================================ ADMIN */
function askAdmin(action){
  adminAction=action;
  if(action==='setpass'){
    $('admin-title').textContent='🔒 เปลี่ยนรหัส Admin';
    $('admin-inp').placeholder='รหัสเดิม';
    $('admin-extra').innerHTML='<input type="password" class="inp" id="admin-new" placeholder="รหัสใหม่" style="margin-top:8px" inputmode="numeric">';
  }else{
    $('admin-title').textContent='🔒 ใส่รหัส Admin เพื่อเปิดดู';
    $('admin-inp').placeholder='รหัส Admin';
    $('admin-extra').innerHTML='';
  }
  $('admin-inp').value='';
  $('admin-modal').classList.remove('hide');
  setTimeout(()=>$('admin-inp').focus(),100);
}
function adminOk(){
  const pass=$('admin-inp').value.trim();
  const cur=(SETTINGS.adminPass||'1234');
  if(pass!==cur && pass!=='1234'){ toast('รหัสไม่ถูกต้อง'); return; }
  if(adminAction==='setpass'){
    const nw=($('admin-new').value||'').trim();
    if(!nw){ toast('ใส่รหัสใหม่'); return; }
    SETTINGS.adminPass=nw;
    if(fbRef){ try{ fbRef.child('settings').set(SETTINGS); }catch(e){} }
    hideEl('admin-modal'); toast('เปลี่ยนรหัสแล้ว ✓'); return;
  }
  adminOK=true; hideEl('admin-modal');
  if(adminAction==='dashboard'){ openDash(); }
  else if(adminAction==='list'){ openList(); }
}

/* ============================================================ RECORD MODEL */
function blankRecord(){
  const now=new Date();
  return {
    id:'tf_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    createdAt:now.toISOString(),
    month: now.getFullYear()+'-'+pad(now.getMonth()+1),
    transporter:'',
    date: now.toISOString().slice(0,10),
    time: hhmm(now),
    location:'', hn:'', patientName:'', dx:'', firstNurse:'',
    vsBP:'', vsP:'', vsR:'', vsT:'',
    cE:'', cV:'', cM:'', cPupil:'',
    nurseNote:'',
    prep:{ idBand:'', record:'', monitor:'', film:'', belongings:'', equipment:'',
      ettOn:false, ettSize:'', ettDepth:'', ambubag:false,
      o2on:false, o2type:[], o2note:'', airwayOther:'',
      iv:false, ivText:'', blood:false, bloodText:'',
      suture:false, pressure:false,
      splint:false, collar:false, scoop:false },
    alertInterval:5,
    departER:'',
    obs:[ emptyObs() ],
    ev:{ ab:'', abDetail:'', circ:'', circDetail:'', bleed:'', bleedDetail:'', dis:'', disDetail:'',
      handover:'', arriveTime:'', summary:'', summaryOther:'', initialHelp:'', wardNurse:'',
      wBP:'', wP:'', wR:'', wT:'', wE:'', wV:'', wM:'', wPupil:'', wO2:'',
      transportComment:'', wardSign:'', transporterSign:'' },
    durationMin:null,
    driveUrl:'', driveId:''
  };
}
function emptyObs(){ return {time:'',bp:'',pr:'',rr:'',temp:'',spo2:'',pupilRt:'',pupilLt:'',e:'',m:'',v:'',pain:'',note:'',recorder:''}; }
function pad(n){ return String(n).padStart(2,'0'); }
function hhmm(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }

/* ============================================================ WIZARD */
const STEP_NAMES=['ผู้นำส่ง','ข้อมูลผู้ป่วย','เตรียมก่อนย้าย','บันทึกพยาบาล','ประเมินนำส่ง'];
function startNew(){ R=blankRecord(); page=1; go('wiz'); renderWiz(); }
function confirmExitWiz(){ if(confirm('ออกจากการกรอก? ข้อมูลที่ยังไม่บันทึกจะหาย')) { stopAlert(); go('home'); } }

function renderSteps(){
  $('wiz-steps').innerHTML = STEP_NAMES.map((n,i)=>{
    const k=i+1; const cls=k===page?'on':(k<page?'done':'');
    return `<div class="wiz-step ${cls}" onclick="gotoPage(${k})">${k}. ${n}</div>`;
  }).join('');
  $('wiz-pt').textContent = R.patientName ? ('· '+R.patientName+(R.hn?' ('+R.hn+')':'')) : '';
}
function gotoPage(k){ savecurrent(); page=k; renderWiz(); }
function wizPrev(){ if(page>1){ savecurrent(); page--; renderWiz(); } }
function wizNext(){ savecurrent(); if(page<PAGES){ page++; renderWiz(); } else { doSave(); } }

function renderWiz(){
  renderSteps();
  $('btn-prev').style.visibility = page>1?'visible':'hidden';
  const nb=$('btn-next');
  if(page<PAGES){ nb.textContent='ถัดไป →'; nb.className='nav-btn nav-next'; }
  else { nb.textContent='💾 บันทึก + สร้าง PDF'; nb.className='nav-btn nav-save'; }
  const b=$('wiz-body');
  if(page===1) b.innerHTML=pg1();
  else if(page===2) b.innerHTML=pg2();

}

function computeDuration(){
  if(R.departER && R.ev.arriveTime){
    const [h1,m1]=R.departER.split(':').map(Number), [h2,m2]=R.ev.arriveTime.split(':').map(Number);
    if(!isNaN(h1)&&!isNaN(h2)){ let d=(h2*60+m2)-(h1*60+m1); if(d<0) d+=1440; R.durationMin=d; }
  }
}

/* ---- alert timer (reminder on page 4) ---- */
function beep(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g);g.connect(audioCtx.destination); o.frequency.value=880; g.gain.setValueAtTime(.001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.4,audioCtx.currentTime+.02); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.5); o.start(); o.stop(audioCtx.currentTime+.55);}catch(e){} try{navigator.vibrate&&navigator.vibrate(400);}catch(e){} }
function startAlert(){
  stopAlert();
  alertTimer=setInterval(()=>{
    if(!R.departER){ return; }
    const [h,m]=R.departER.split(':').map(Number); if(isNaN(h)) return;
    const now=new Date(); const elapsed=(now.getHours()*60+now.getMinutes())-(h*60+m);
    const el=$('alert-txt'); if(!el) return;
    if(elapsed<0){ el.textContent='รอถึงเวลาออกจาก ER'; return; }
    const nextIn=R.alertInterval-(elapsed%R.alertInterval);
    el.textContent=`ผ่านไป ${elapsed} นาที · ครบรอบบันทึกถัดไปในอีก ${nextIn} นาที`;
    if(elapsed>0 && elapsed%R.alertInterval===0 && now.getSeconds()<2){
      beep(); $('alert-bar').style.background='#fee2e2';
      el.textContent=`⏰ ครบ ${elapsed} นาที — บันทึก vital sign!`;
      setTimeout(()=>{const b=$('alert-bar'); if(b)b.style.background='#fffbeb';},4000);
    }
  },1000);
}
function stopAlert(){ if(alertTimer){ clearInterval(alertTimer); alertTimer=null; } }

/* ---- signatures ---- */
function initSig(canvas){
  const name=canvas.dataset.sig;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*2; canvas.height=150*2;
  const ctx=canvas.getContext('2d'); ctx.scale(2,2); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#0f172a';
  const pad={canvas,ctx,drawn:false}; sigPads[name]=pad;
  if(R.ev[name]){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,rect.width,150); img.src=R.ev[name]; pad.drawn=true; }
  let drawing=false,lx=0,ly=0;
  const pos=e=>{ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  const start=e=>{ drawing=true; const p=pos(e); lx=p.x;ly=p.y; e.preventDefault(); };
  const move=e=>{ if(!drawing)return; const p=pos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x;ly=p.y; pad.drawn=true; e.preventDefault(); };
  const end=()=>{ drawing=false; };
  canvas.onmousedown=start; canvas.onmousemove=move; canvas.onmouseup=end; canvas.onmouseleave=end;
  canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;
}
function clearSig(name){ const p=sigPads[name]; if(p){ p.ctx.clearRect(0,0,p.canvas.width,p.canvas.height); p.drawn=false; } R.ev[name]=''; }
function saveSigs(){ Object.entries(sigPads).forEach(([name,p])=>{ if(p.drawn){ try{ R.ev[name]=p.canvas.toDataURL('image/png'); }catch(e){} } }); }

/* ============================================================ SAVE + PDF + DRIVE */
async function doSave(){
  savecurrent();
  if(!R.patientName && !R.hn){ if(!confirm('ยังไม่ได้กรอกชื่อ/HN ผู้ป่วย — บันทึกต่อไหม?')) { page=2; renderWiz(); return; } }
  stopAlert();
  R.month = (R.date||'').slice(0,7) || R.month;
  toast('กำลังบันทึก...',6000);
  // 1) save to firebase
  if(fbRef){ try{ await fbRef.child('cases/'+R.id).set(stripUndef(R)); }catch(e){ console.warn(e); } }
  // 2) build A4 PDF + upload to Drive
  let uploaded=false;
  try{
    const blob=await buildPdfBlob();
    if(blob && DRIVE_URL){
      const res=await driveUploadPdf(blob, pdfName());
      if(res&&res.ok){ R.driveUrl=res.url||''; R.driveId=res.id||''; uploaded=true;
        if(fbRef){ try{ fbRef.child('cases/'+R.id).update({driveUrl:R.driveUrl,driveId:R.driveId}); }catch(e){} }
      }
    }
  }catch(e){ console.warn('pdf/drive',e); }
  toast(uploaded?'บันทึกแล้ว + อัปโหลด PDF ขึ้น Drive ✓':'บันทึกข้อมูลแล้ว ✓ (PDF: '+(DRIVE_URL?'อัปโหลดไม่สำเร็จ ลองพิมพ์เอง':'ยังไม่ตั้งค่า Drive')+')', 4200);
  go('home');
}
function pdfName(){ return `ใบนำส่ง_${(R.hn||'noHN')}_${(R.patientName||'').replace(/\s+/g,'')}_${R.date}_${(R.time||'').replace(':','')}.pdf`; }
function stripUndef(o){ return JSON.parse(JSON.stringify(o)); }

async function buildPdfBlob(){
  if(typeof html2canvas==='undefined' || !window.jspdf){ return null; }
  renderA4(R);
  const el=$('a4-form'); el.classList.add('showprint');
  await new Promise(r=>setTimeout(r,60));
  const canvas=await html2canvas(el,{scale:2,backgroundColor:'#fff',windowWidth:794});
  el.classList.remove('showprint');
  const { jsPDF }=window.jspdf;
  const pdf=new jsPDF('p','mm','a4');
  const pw=210, ph=297;
  const imgW=pw, imgH=canvas.height*pw/canvas.width;
  let left=imgH, pos=0;
  const img=canvas.toDataURL('image/jpeg',0.9);
  pdf.addImage(img,'JPEG',0,0,imgW,imgH);
  left-=ph;
  while(left>0){ pos-=ph; pdf.addPage(); pdf.addImage(img,'JPEG',0,pos,imgW,imgH); left-=ph; }
  return pdf.output('blob');
}
function blobToBase64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); }); }
async function driveUploadPdf(blob,name){
  const dataBase64=await blobToBase64(blob);
  const ctrl=('AbortController'in window)?new AbortController():null;
  const to=ctrl?setTimeout(()=>ctrl.abort(),60000):null;
  let r;
  try{ r=await fetch(DRIVE_URL,{method:'POST',body:JSON.stringify({action:'upload',name,mime:'application/pdf',dataBase64}),signal:ctrl?ctrl.signal:undefined}); }
  catch(e){ if(to)clearTimeout(to); throw e; }
  if(to)clearTimeout(to);
  const text=await r.text(); let j; try{ j=JSON.parse(text); }catch(_){ throw new Error('bad drive response'); }
  return j;
}

/* ============================================================ DASHBOARD */
function openDash(){ go('dash'); const m=$('dash-month'); if(!m.value) m.value=new Date().toISOString().slice(0,7); renderDash(); }
function isInappropriate(r){ return ['ab','circ','bleed','dis'].some(k=>r.ev&&r.ev[k]==='inappropriate'); }
function isWorse(r){ return r.ev&&r.ev.summary==='worse'; }
function hasComment(r){ return r.ev&&(r.ev.transportComment||'').trim(); }
function monthCases(m){ return Object.values(CASES).filter(r=>r&&(r.month===m||(r.date||'').slice(0,7)===m)); }
function renderDash(){
  const m=$('dash-month').value; const list=monthCases(m);
  const total=list.length, bad=list.filter(isInappropriate).length, worse=list.filter(isWorse).length, cmt=list.filter(hasComment).length;
  $('dash-stats').innerHTML=`
    <div class="stat"><div class="v">${total}</div><div class="l">เคสนำส่งทั้งหมด</div></div>
    <div class="stat bad"><div class="v">${bad}</div><div class="l">ทำหัตถการไม่เหมาะสม</div></div>
    <div class="stat worse"><div class="v">${worse}</div><div class="l">อาการทรุดลง</div></div>
    <div class="stat cmt"><div class="v">${cmt}</div><div class="l">มี comment จากทีมนำส่ง</div></div>`;
  const review=list.filter(r=>isInappropriate(r)||hasComment(r)||isWorse(r)).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  $('dash-list').innerHTML = review.length? `<h3 style="color:var(--navy)">เคสที่ควรทบทวน (${review.length})</h3>`+review.map(recCardHtml).join('') : '<div style="color:var(--muted);text-align:center;padding:20px">— ไม่มีเคสที่ต้องทบทวนในเดือนนี้ —</div>';
}

  el.classList.add('showprint'); window.print(); setTimeout(()=>el.classList.remove('showprint'),500);
}
