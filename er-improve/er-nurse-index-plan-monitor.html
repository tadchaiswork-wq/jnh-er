<script>
const ORDER_TYPE_NAMES = {'oneday': 'One Day Order', 'continuous': 'Continuous Order'};
const PLAN_SCH_TYPE_NAMES = {'time': 'แบบระบุเวลา', 'date': 'แบบไม่ระบุเวลา', 'stat': 'Stat'};
// ข้อมูลสมมติ (รูปแบบเดียวกับ opd-er-nurse-index-plan-monitor-data.php)
var PLANS = [
    {bed: 'Resus 1', vn: '691104083015', hn: '000123456', name: 'นายสมชาย ตัวอย่างดี', note: 'Chest pain, EKG ST elevation', order_no: 25110, allergy: 'PENICILLIN=ผื่นคัน, IBUPROFEN=หน้าบวม',
     od: '2026-11-04 08:50', ot: 'oneday', type: 'med', med: 'ASPIRIN 300 mg tab', detail: 'chew 1 tab stat', plan: '2026-11-04 09:00', sch: 'stat', pdetail: 'ให้ยาทันที', act: '2026-11-04 09:05', p1: 'พย.สุดา ใจดี', p2: '', res: 'ให้ยาแล้ว ไม่มีอาการผิดปกติ', rem: ''},
    {bed: 'Resus 1', vn: '691104083015', hn: '000123456', name: 'นายสมชาย ตัวอย่างดี', note: 'Chest pain, EKG ST elevation', order_no: 25110, allergy: 'PENICILLIN=ผื่นคัน, IBUPROFEN=หน้าบวม',
     od: '2026-11-04 08:50', ot: 'continuous', type: 'other', med: null, detail: 'EKG 12 leads q 15 min x 4', plan: '2026-11-04 10:30', sch: 'time', pdetail: 'EKG ครั้งที่ 3', act: null, p1: '', p2: '', res: '', rem: ''},
    {bed: 'Resus 2', vn: '691104065230', hn: '000099871', name: 'นายประยุทธ มั่นคง', note: 'Sepsis, on Levophed', order_no: 25098, allergy: '',
     od: '2026-11-04 07:05', ot: 'continuous', type: 'med', med: 'NOREPINEPHRINE 4 mg/4 ml inj', detail: '4 mg + 5%D/W 250 ml IV drip 10 ml/hr\nkeep MAP ≥ 65', plan: '2026-11-04 11:00', sch: 'time', pdetail: 'ประเมิน MAP และปรับ rate', act: null, p1: '', p2: '', res: '', rem: ''},
    {bed: 'Urgent 1', vn: '691104094410', hn: '000387002', name: 'ด.ช.ภูมิ รักเรียน', note: 'Febrile convulsion', order_no: 25117, allergy: '',
     od: '2026-11-04 10:00', ot: 'oneday', type: 'med', med: 'PARACETAMOL syr 120 mg/5 ml', detail: '5 ml oral prn ไข้ ≥ 38 °C ทุก 4-6 hr', plan: '2026-11-04', sch: 'date', pdetail: 'เช็ดตัวลดไข้ + วัด BT ทุก 1 hr', act: null, p1: '', p2: '', res: '', rem: ''},
    {bed: 'Urgent 3', vn: '691104091102', hn: '000245117', name: 'นางสาวมาลี ใจงาม', note: 'Acute gastroenteritis', order_no: 25114, allergy: '',
     od: '2026-11-04 09:20', ot: 'oneday', type: 'off', med: null, offmed: 'ONDANSETRON 8 mg inj', detail: '8 mg IV q 8 hr', plan: '2026-11-04 10:00', sch: 'time', pdetail: 'หยุดยา', act: '2026-11-04 10:05', p1: 'พย.วรรณา มีสุข', p2: '', res: 'Off แล้ว', rem: ''},
    {bed: 'Obs 2', vn: '691104071555', hn: '000412663', name: 'นางบุญมี ศรีสุข', note: 'Asthma exacerbation', order_no: 25102, allergy: 'ASPIRIN=หอบ',
     od: '2026-11-04 07:20', ot: 'oneday', type: 'med', med: 'SALBUTAMOL NB 2.5 mg/2.5 ml', detail: '1 NB q 20 min x 3 then q 4 hr', plan: '2026-11-04 11:20', sch: 'time', pdetail: 'NB รอบ 4 hr', act: null, p1: '', p2: '', res: '', rem: 'ฟัง wheezing ก่อนพ่น'},
    {bed: 'Obs 4', vn: '691103221804', hn: '000310045', name: 'นายวิชัย ทองดี', note: 'Head injury, observe 24 hr', order_no: 25087, allergy: '',
     od: null, ot: null, type: null, med: null, detail: null, plan: '2026-11-04 12:00', sch: 'time', pdetail: 'N/S (GCS, pupil) q 1 hr', act: null, p1: '', p2: '', res: '', rem: '', noOrder: true}
];
function thDate(s, withTime) {
    var m = moment(s, 'YYYY-MM-DD HH:mm');
    return m.format('DD/MM/') + (parseInt(m.format('YYYY'), 10) + 543) + (withTime ? m.format(' HH:mm') : '');
}
function orderText(v) {
    if (v.noOrder) return '*รายการนี้ไม่ได้ผูกกับ Order*';
    var m = moment(v.od, 'YYYY-MM-DD HH:mm');
    var t = m.format('DD/MM/') + (parseInt(m.format('YYYY'), 10) + 543) + m.format(', HH:mm') + ' น. (' + ORDER_TYPE_NAMES[v.ot] + ')\n';
    if (v.type == 'off') t += 'Off : ' + v.offmed + '\n' + v.detail;
    else t += (v.med ? v.med + '\n' : '') + v.detail;
    return t;
}
function renderTable() {
    if ($.fn.DataTable.isDataTable('#index-table')) $('#index-table').DataTable().destroy();
    var state = $('#index_action_state').val();
    var q = $.trim($('#patient').val());
    var body = $('#index-table-tbody').empty();
    PLANS.forEach(function (v) {
        if (state == 'Y' && !v.act) return;
        if (state == 'N' && v.act) return;
        if (q && (v.hn + v.vn + v.name).indexOf(q) < 0) return;
        var timed = v.sch != 'date';
        $('<tr/>', {style: 'cursor: pointer;', click: function () { openModal(v); }}).append(
            $('<td/>', {text: v.bed}),
            $('<td/>').append($('<div/>', {text: v.vn}), $('<div/>', {text: v.hn})),
            $('<td/>').append($('<div/>', {'class': 'font-weight-bold', text: v.name}), $('<div/>', {style: 'white-space: pre-wrap;', text: v.note})),
            $('<td/>', {'class': 'order-display-text', style: (v.type == 'med' ? 'color: blue;' : ''), text: orderText(v)}),
            $('<td/>', {'class': 'order-display-text', text: thDate(v.plan, timed) + '\n(' + PLAN_SCH_TYPE_NAMES[v.sch] + ')'}),
            $('<td/>').append($('<div/>', {'class': 'order-display-text', style: 'max-height: 300px; overflow-y: auto;', text: v.pdetail})),
            $('<td/>', {text: v.act ? thDate(v.act, true) : ''}),
            $('<td/>').append(v.p1 ? $('<div/>', {text: '- ' + v.p1}) : '', v.p2 ? $('<div/>', {text: '- ' + v.p2}) : ''),
            $('<td/>').append($('<div/>', {'class': 'order-display-text', style: 'max-height: 300px; overflow-y: auto;', text: v.res})),
            $('<td/>').append($('<div/>', {'class': 'order-display-text', style: 'max-height: 300px; overflow-y: auto;', text: v.rem}))
        ).appendTo(body);
    });
    $('#index-table').DataTable({filter: false, paging: false, language: {emptyTable: 'ไม่มีรายการ', info: 'แสดง _TOTAL_ รายการ', infoEmpty: ''}});
}
function openModal(v) {
    $('#m_bed').text(v.bed); $('#m_order_no').text(v.order_no); $('#m_hn').text(v.hn); $('#m_name').text(v.name);
    $('#m_allergy').text(v.allergy || 'ไม่มีข้อมูล');
    $('#index-plan-order-item-detail').val(orderText(v));
    $('#index-plan-plan-sch-type').val(v.sch);
    $('#index-plan-plan-date').val(v.plan.substr(0, 10));
    $('#index-plan-plan-time').val(v.plan.length > 10 ? v.plan.substr(11, 5) : '');
    $('#index-plan-plan-detail').val(v.pdetail);
    $('#index-plan-action-date').val(v.act ? v.act.substr(0, 10) : '');
    $('#index-plan-action-time').val(v.act ? v.act.substr(11, 5) : '');
    $('#index-plan-action-result').val(v.res);
    $('#index-plan-action-remark').val(v.rem);
    $('#index-plan-action-person-1').val(v.p1);
    $('#index-plan-action-person-2').val(v.p2);
    $('#indexPlanFormModal').modal('show');
}
function setNow() {
    $('#index-plan-action-date').val(moment().format('YYYY-MM-DD'));
    $('#index-plan-action-time').val(moment().format('HH:mm'));
}
$(renderTable);
</script>
