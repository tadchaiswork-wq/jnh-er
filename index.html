<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JNH ER</title>
<meta http-equiv="refresh" content="0; url=portal/" />
<link rel="canonical" href="portal/" />
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Sarabun',sans-serif;
    background:radial-gradient(1000px 500px at 50% -10%,#cffafe,#f1f5f9);color:#155e75}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .m{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,#0e7490,#155e75);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;box-shadow:0 10px 24px rgba(14,116,144,.35)}
  h1{margin:0;font-size:26px;letter-spacing:.5px}
  p{margin:0;color:#64748b;font-size:15px}
  a{color:#0e7490;font-weight:700;text-decoration:none}
  .sp{width:26px;height:26px;border:3px solid #bae6fd;border-top-color:#0e7490;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="c">
    <div class="m">✚</div>
    <h1>JNH ER</h1>
    <div class="sp"></div>
    <p>กำลังเข้าสู่ระบบ… ถ้าไม่เด้งอัตโนมัติ <a href="portal/">คลิกที่นี่</a></p>
  </div>
  <script>location.replace("portal/");</script>
</body>
</html>
